<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealBrand - Cart</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

header{
background:#131921;
padding:14px 5%;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffcc00;
text-decoration:none;
}

.home{
color:white;
text-decoration:none;
font-size:15px;
}

.container{
width:92%;
max-width:1100px;
margin:25px auto;
}

.cart-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px #ddd;
}

h1{
margin-bottom:20px;
}

.cart-item{
display:flex;
align-items:center;
gap:15px;
padding:18px 0;
border-bottom:1px solid #ddd;
}

.icon{
font-size:45px;
width:70px;
text-align:center;
}

.info{
flex:1;
}

.info h3{
margin-bottom:8px;
}

.price{
font-weight:bold;
font-size:18px;
}

.quantity{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

.quantity button{
width:32px;
height:32px;
border:1px solid #ccc;
background:white;
border-radius:5px;
font-size:18px;
cursor:pointer;
}

.quantity span{
min-width:25px;
text-align:center;
font-weight:bold;
}

.remove{
background:#e53935;
color:white;
border:0;
padding:9px 13px;
border-radius:5px;
cursor:pointer;
}

.summary{
margin-top:25px;
padding-top:20px;
border-top:2px solid #ddd;
text-align:right;
}

.total{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.checkout{
display:inline-block;
background:#ff9900;
color:#111;
padding:14px 30px;
border-radius:7px;
text-decoration:none;
font-weight:bold;
font-size:17px;
}

.continue{
display:inline-block;
margin-right:10px;
padding:13px 22px;
border:1px solid #ccc;
border-radius:7px;
text-decoration:none;
color:#222;
background:white;
}

.empty{
text-align:center;
padding:50px 10px;
}

.empty h2{
margin-bottom:15px;
}

.empty a{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#ff9900;
color:#111;
text-decoration:none;
border-radius:7px;
font-weight:bold;
}

@media(max-width:600px){

.cart-item{
align-items:flex-start;
}

.icon{
font-size:35px;
width:50px;
}

.info h3{
font-size:16px;
}

.price{
font-size:16px;
}

.remove{
padding:7px 9px;
}

.summary{
text-align:center;
}

.continue,
.checkout{
display:block;
width:100%;
margin:8px 0;
}

}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
DealBrand
</a>

<a href="index.html" class="home">
🏠 Home
</a>

</header>

<div class="container">

<div class="cart-box">

<h1>🛒 Your Cart</h1>

<div id="cartContainer"></div>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let container =
document.getElementById("cartContainer");

function showCart(){

container.innerHTML="";

if(cart.length === 0){

container.innerHTML=`

<div class="empty">

<h2>Your cart is empty 🛒</h2>

<p>Add some products to your cart.</p>

<a href="index.html">
Continue Shopping
</a>

</div>

`;

return;

}

let total=0;

cart.forEach((item,index)=>{

let price=Number(item.price) || 0;

let quantity=Number(item.quantity) || 1;

total += price * quantity;

let div=document.createElement("div");

div.className="cart-item";

div.innerHTML=`

<div class="icon">
${item.icon || "🛍️"}
</div>

<div class="info">

<h3>${item.name}</h3>

<div class="price">
₹${price.toLocaleString("en-IN")}
</div>

<div class="quantity">

<button onclick="decrease(${index})">
−
</button>

<span>
${quantity}
</span>

<button onclick="increase(${index})">
+
</button>

</div>

</div>

<button
class="remove"
onclick="removeItem(${index})">
Remove
</button>

`;

container.appendChild(div);

});

let summary=document.createElement("div");

summary.className="summary";

summary.innerHTML=`

<div class="total">
Total: ₹${total.toLocaleString("en-IN")}
</div>

<a href="index.html" class="continue">
← Continue Shopping
</a>

<a href="checkout.html" class="checkout">
Proceed to Checkout →
</a>

`;

container.appendChild(summary);

}

function increase(index){

cart[index].quantity =
(Number(cart[index].quantity) || 1) + 1;

saveCart();

}

function decrease(index){

let quantity =
Number(cart[index].quantity) || 1;

if(quantity > 1){

cart[index].quantity =
quantity - 1;

}
else{

cart.splice(index,1);

}

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

showCart();

}

showCart();

</script>

</body>
</html>
