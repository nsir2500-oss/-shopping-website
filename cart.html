<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBrand - Cart</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#f5f5f5;
  color:#111;
}

header{
  background:#131921;
  color:white;
  padding:15px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ffb000;
}

.home{
  background:#ffb000;
  color:#111;
  padding:10px 16px;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  width:92%;
  max-width:1000px;
  margin:25px auto;
}

h1{
  margin-bottom:20px;
}

.cart-item{
  background:white;
  padding:18px;
  margin-bottom:12px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  box-shadow:0 2px 8px #ddd;
}

.info{
  flex:1;
}

.info h3{
  margin-bottom:8px;
}

.price{
  font-weight:bold;
  font-size:18px;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.controls button{
  width:35px;
  height:35px;
  border:0;
  border-radius:5px;
  background:#ddd;
  font-size:18px;
  cursor:pointer;
}

.remove{
  background:#dc2626 !important;
  color:white;
  padding:9px 12px;
  width:auto !important;
}

.summary{
  background:white;
  margin-top:20px;
  padding:22px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}

.summary p{
  font-size:18px;
  margin-bottom:12px;
}

.checkout{
  width:100%;
  border:0;
  background:#ffb000;
  padding:14px;
  border-radius:7px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  background:white;
  text-align:center;
  padding:50px 20px;
  border-radius:10px;
}

.shop{
  display:inline-block;
  margin-top:18px;
  background:#2563eb;
  color:white;
  padding:12px 20px;
  border-radius:6px;
  text-decoration:none;
}

@media(max-width:600px){
  .cart-item{
    flex-direction:column;
    align-items:flex-start;
  }

  .controls{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Deal<span>Brand</span></div>
  <a class="home" href="index.html">🏠 Home</a>
</header>

<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cartBox"></div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("dealbrandCart")) || [];

function saveCart(){
  localStorage.setItem("dealbrandCart",JSON.stringify(cart));
}

function increase(index){
  cart.push({
    name:cart[index].name,
    price:cart[index].price
  });

  saveCart();
  displayCart();
}

function decrease(index){

  const name = cart[index].name;

  const itemIndex = cart.findIndex(item => item.name === name);

  if(itemIndex !== -1){
    cart.splice(itemIndex,1);
  }

  saveCart();
  displayCart();
}

function removeItem(name){

  cart = cart.filter(item => item.name !== name);

  saveCart();
  displayCart();
}

function checkout(){

  if(cart.length === 0){
    alert("Your cart is empty.");
    return;
  }

  const total = cart.reduce(
    (sum,item)=>sum + item.price,
    0
  );

  alert(
    "🎉 Checkout Started!\n\n" +
    "Total Amount: ₹" + total +
    "\n\nPayment system will be connected next."
  );
}

function displayCart(){

  const box = document.getElementById("cartBox");

  if(cart.length === 0){

    box.innerHTML = `
      <div class="empty">
        <h2>Your cart is empty 🛒</h2>
        <p>Add some products from DealBrand.</p>
        <a class="shop" href="index.html">
          Continue Shopping
        </a>
      </div>
    `;

    return;
  }

  const grouped = {};

  cart.forEach(item => {

    if(!grouped[item.name]){
      grouped[item.name] = {
        name:item.name,
        price:item.price,
        quantity:0
      };
    }

    grouped[item.name].quantity++;
  });

  let html = "";

  Object.values(grouped).forEach((item,index)=>{

    html += `
      <div class="cart-item">

        <div class="info">
          <h3>${item.name}</h3>
          <div class="price">
            ₹${item.price} × ${item.quantity}
          </div>
        </div>

        <div class="controls">

          <button onclick="decrease(${cart.findIndex(x=>x.name===item.name)})">
            −
          </button>

          <strong>${item.quantity}</strong>

          <button onclick="increase(${cart.findIndex(x=>x.name===item.name)})">
            +
          </button>

          <button class="remove"
          onclick="removeItem('${item.name}')">
            Remove
          </button>

        </div>

      </div>
    `;
  });

  const total = cart.reduce(
    (sum,item)=>sum + item.price,
    0
  );

  html += `
    <div class="summary">

      <p>
        <strong>Total Items:</strong>
        ${cart.length}
      </p>

      <p>
        <strong>Total:</strong>
        ₹${total}
      </p>

      <button class="checkout" onclick="checkout()">
        Proceed to Checkout →
      </button>

    </div>
  `;

  box.innerHTML = html;
}

displayCart();

</script>

</body>
</html>
