<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Online Shopping</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .search {
      flex: 1;
      min-width: 220px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    .cart {
      background: #f59e0b;
      color: #111;
      border: none;
      padding: 11px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      margin: 20px 5%;
      padding: 45px 25px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
    }

    .section {
      padding: 10px 5%;
    }

    .section h2 {
      margin-bottom: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 170px;
      background: #e5e7eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🛍️ ShopEasy</div>

    <input
      class="search"
      type="text"
      placeholder="Search products..."
    >

    <button class="cart">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <section class="hero">
    <h1>Welcome to ShopEasy</h1>
    <p>Best Products • Best Deals • Easy Shopping</p>
  </section>

  <section class="section">
    <h2>🔥 Popular Products</h2>

    <div class="products">

      <div class="product">
        <div class="product-image">📱</div>
        <h3>Smartphone</h3>
        <div class="price">₹14,999</div>
        <button class="add" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <div class="product-image">🎧</div>
        <h3>Wireless Headphones</h3>
        <div class="price">₹1,499</div>
        <button class="add" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <div class="product-image">⌚</div>
        <h3>Smart Watch</h3>
        <div class="price">₹2,999</div>
        <button class="add" onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="product">
        <div class="product-image">🎒</div>
        <h3>Travel Backpack</h3>
        <div class="price">₹899</div>
        <button class="add" onclick="addToCart()">Add to Cart</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 ShopEasy — Your Online Shopping Store
  </footer>

  <script>
    let cart = 0;

    function addToCart() {
      cart++;
      document.getElementById("cartCount").innerText = cart;
      alert("Product added to cart!");
    }
  </script>

</body>
</html>
