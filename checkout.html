<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBrand - Checkout</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

header{
background:#131921;
padding:14px 5%;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffcc00;
text-decoration:none;
}

.container{
width:92%;
max-width:1100px;
margin:25px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.box{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px #ddd;
margin-bottom:20px;
}

h2{
margin-bottom:20px;
}

label{
display:block;
font-weight:bold;
margin:14px 0 6px;
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

textarea{
height:90px;
resize:none;
}

.payment{
padding:12px;
background:#f8f8f8;
border-radius:6px;
margin:8px 0;
}

.summary-item{
display:flex;
justify-content:space-between;
margin:12px 0;
}

.total{
border-top:1px solid #ddd;
padding-top:15px;
margin-top:15px;
font-size:21px;
font-weight:bold;
}

.place{
width:100%;
padding:14px;
border:0;
border-radius:7px;
background:#ff9900;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

@media(max-width:700px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">DealBrand</a>
</header>

<div class="container">

<div>

<div class="box">

<h2>📍 Delivery Address</h2>

<form id="checkoutForm">

<label>Full Name</label>
<input id="name" type="text" placeholder="Enter full name" required>

<label>Mobile Number</label>
<input id="mobile" type="tel" placeholder="Enter mobile number" required>

<label>PIN Code</label>
<input id="pin" type="number" placeholder="Enter PIN code" required>

<label>City</label>
<input id="city" type="text" placeholder="Enter city" required>

<label>State</label>
<input id="state" type="text" placeholder="Enter state" required>

<label>Full Address</label>
<textarea id="address" placeholder="House no., street, area..." required></textarea>

<h2 style="margin-top:25px;">💳 Payment Method</h2>

<div class="payment">
<label>
<input type="radio" name="payment" value="COD" checked>
 Cash on Delivery
</label>
</div>

<div class="payment">
<label>
<input type="radio" name="payment" value="Online">
 Online Payment
</label>
</div>

<button class="place" type="submit">
🛍️ Place Order
</button>

</form>

</div>

</div>

<div>

<div class="box">

<h2>🧾 Order Summary</h2>

<div id="summary"></div>

</div>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let summary =
document.getElementById("summary");

let total = 0;

if(cart.length === 0){

summary.innerHTML =
"<p>Your cart is empty.</p>";

}
else{

cart.forEach(item => {

total += Number(item.price);

let div =
document.createElement("div");

div.className="summary-item";

div.innerHTML=`
<span>${item.name}</span>
<b>₹${Number(item.price).toLocaleString("en-IN")}</b>
`;

summary.appendChild(div);

});

summary.innerHTML += `

<div class="summary-item">
<span>Delivery</span>
<b>FREE</b>
</div>

<div class="total">
Total: ₹${total.toLocaleString("en-IN")}
</div>

`;

}

document
.getElementById("checkoutForm")
.addEventListener("submit",function(event){

event.preventDefault();

if(cart.length === 0){

alert("Your cart is empty!");

return;

}

let address = {

name:document.getElementById("name").value,
mobile:document.getElementById("mobile").value,
pin:document.getElementById("pin").value,
city:document.getElementById("city").value,
state:document.getElementById("state").value,
address:document.getElementById("address").value

};

let payment =
document.querySelector(
'input[name="payment"]:checked'
).value;

let order = {

items:cart.map(item => ({

name:item.name,
price:item.price,
quantity:1,
icon:"🛍️"

})),

address:address,

payment:payment,

status:"Order Placed",

total:total

};

let orders =
JSON.parse(
localStorage.getItem("dealbrand_orders")
) || [];

orders.push(order);

localStorage.setItem(
"dealbrand_orders",
JSON.stringify(orders)
);

localStorage.removeItem("cart");

alert(
"🎉 Order placed successfully!"
);

window.location.href="orders.html";

});

</script>

</body>
</html>
