<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealBrand Seller Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#2874f0;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-right a{
    color:white;
    text-decoration:none;
    margin-left:15px;
}

.container{
    width:92%;
    max-width:1100px;
    margin:25px auto;
}

.dashboard-title{
    margin-bottom:20px;
}

.dashboard-title h1{
    font-size:28px;
}

.dashboard-title p{
    color:#666;
    margin-top:5px;
}

.card{
    background:white;
    padding:22px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h2{
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2874f0;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.discount-box{
    background:#f7faff;
    padding:15px;
    border-radius:8px;
    border:1px solid #e1e8f5;
}

.discount-options{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.discount-options label{
    font-weight:normal;
}

.discount-percent{
    margin-top:12px;
    display:none;
}

.image-preview{
    width:120px;
    height:120px;
    background:#f2f2f2;
    border-radius:8px;
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:45px;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.submit-btn{
    width:100%;
    padding:14px;
    background:#2874f0;
    color:white;
    border:0;
    border-radius:6px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:#1765df;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
    background:#e8f7e8;
    color:#147a14;
    font-weight:bold;
}

.products-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.seller-product{
    border:1px solid #eee;
    border-radius:8px;
    padding:15px;
}

.seller-product-icon{
    font-size:50px;
    text-align:center;
    margin-bottom:10px;
}

.seller-product h3{
    margin-bottom:7px;
}

.product-price{
    font-weight:bold;
    font-size:18px;
}

.delete-btn{
    margin-top:10px;
    width:100%;
    padding:8px;
    border:0;
    border-radius:5px;
    background:#e53935;
    color:white;
    cursor:pointer;
}

@media(max-width:650px){

    header{
        padding:15px 4%;
    }

    .header-right{
        font-size:13px;
    }

    .container{
        width:94%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        DealBrand Seller
    </div>

    <div class="header-right">
        <a href="products.html">Products</a>
        <a href="index.html">Home</a>
    </div>

</header>


<div class="container">

    <div class="dashboard-title">

        <h1>Seller Dashboard</h1>

        <p>
            Add and manage your products on DealBrand
        </p>

    </div>


    <div id="message" class="message">
        Product added successfully!
    </div>


    <div class="card">

        <h2>➕ Add New Product</h2>


        <form id="productForm">

            <div class="form-grid">


                <!-- SELLER -->

                <div class="form-group">

                    <label>
                        Seller Name
                    </label>

                    <input
                        type="text"
                        id="sellerName"
                        placeholder="Enter seller name"
                        required
                    >

                </div>


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select
                        id="category"
                        onchange="updateSubcategories()"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="smartphones">
                            Mobiles & Tablets
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="fashion">
                            Fashion
                        </option>

                        <option value="shoes">
                            Footwear
                        </option>

                        <option value="home">
                            Home & Kitchen
                        </option>

                        <option value="gaming">
                            Gaming
                        </option>

                        <option value="beauty">
                            Beauty
                        </option>

                        <option value="watches">
                            Watches
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="grocery">
                            Grocery
                        </option>

                        <option value="books">
                            Books
                        </option>

                        <option value="toys">
                            Toys
                        </option>

                    </select>

                </div>


                <!-- SUBCATEGORY -->

                <div class="form-group">

                    <label>
                        Subcategory
                    </label>

                    <select
                        id="subcategory"
                        required
                    >

                        <option value="">
                            Select Category First
                        </option>

                    </select>

                </div>


                <!-- MRP -->

                <div class="form-group">

                    <label>
                        MRP ₹
                    </label>

                    <input
                        type="number"
                        id="mrp"
                        min="0"
                        step="0.01"
                        placeholder="Seller enters MRP"
                        required
                    >

                </div>


                <!-- SELLING PRICE -->

                <div class="form-group">

                    <label>
                        Selling Price ₹
                    </label>

                    <input
                        type="number"
                        id="sellingPrice"
                        min="0"
                        step="0.01"
                        placeholder="Seller enters selling price"
                        required
                    >

                </div>


                <!-- DISCOUNT -->

                <div class="form-group full">

                    <div class="discount-box">

                        <label>
                            Discount
                        </label>

                        <div class="discount-options">

                            <label>
                                <input
                                    type="radio"
                                    name="discount"
                                    value="yes"
                                    onchange="toggleDiscount(true)"
                                >
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="discount"
                                    value="no"
                                    checked
                                    onchange="toggleDiscount(false)"
                                >
                                No
                            </label>

                        </div>


                        <div
                            id="discountPercentBox"
                            class="discount-percent"
                        >

                            <label>
                                Discount Percentage %
                            </label>

                            <input
                                type="number"
                                id="discountPercent"
                                min="1"
                                max="100"
                                placeholder="Example: 20"
                            >

                        </div>

                    </div>

                </div>


                <!-- STOCK -->

                <div class="form-group">

                    <label>
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        placeholder="Available stock"
                        required
                    >

                </div>


                <!-- ICON -->

                <div class="form-group">

                    <label>
                        Product Icon
                    </label>

                    <input
                        type="text"
                        id="productIcon"
                        maxlength="4"
                        placeholder="Example: 📱"
                        value="🛍️"
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label>
                        Product Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Write product details..."
                    ></textarea>

                </div>


                <!-- IMAGE -->

                <div class="form-group full">

                    <label>
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                        onchange="previewImage(event)"
                    >

                    <div
                        id="imagePreview"
                        class="image-preview"
                    >
                        🖼️
                    </div>

                </div>


                <div class="form-group full">

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        ➕ Add Product
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- SELLER PRODUCTS -->

    <div class="card">

        <h2>📦 My Products</h2>

        <div
            id="sellerProducts"
            class="products-list"
        ></div>

    </div>

</div>


<script>


/* ==========================================
   SUBCATEGORY DATA
========================================== */

const subcategories = {

    smartphones:[
        ["smartphones","Smartphones"],
        ["feature-phones","Feature Phones"],
        ["tablets","Tablets"],
        ["chargers","Chargers"],
        ["power-banks","Power Banks"],
        ["earphones","Earphones"],
        ["cases","Cases & Covers"]
    ],

    electronics:[
        ["laptops","Laptops"],
        ["computers","Computers"],
        ["monitors","Monitors"],
        ["headphones","Headphones"],
        ["speakers","Speakers"],
        ["cameras","Cameras"],
        ["televisions","Televisions"],
        ["printers","Printers"]
    ],

    fashion:[
        ["men","Men"],
        ["women","Women"],
        ["kids","Kids"],
        ["tshirts","T-Shirts"],
        ["shirts","Shirts"],
        ["jeans","Jeans"],
        ["ethnic","Ethnic Wear"],
        ["winter","Winter Wear"]
    ],

    shoes:[
        ["mens-shoes","Men's Shoes"],
        ["womens-shoes","Women's Shoes"],
        ["sports-shoes","Sports Shoes"],
        ["sneakers","Sneakers"],
        ["sandals","Sandals"],
        ["slippers","Slippers"],
        ["formal-shoes","Formal Shoes"],
        ["kids-footwear","Kids Footwear"]
    ],

    home:[
        ["kitchen","Kitchen"],
        ["cookware","Cookware"],
        ["home-decor","Home Decor"],
        ["furniture","Furniture"],
        ["bedsheets","Bedsheets"],
        ["curtains","Curtains"],
        ["storage","Storage"],
        ["cleaning","Cleaning"]
    ],

    gaming:[
        ["gaming-consoles","Gaming Consoles"],
        ["controllers","Controllers"],
        ["gaming-mouse","Gaming Mouse"],
        ["gaming-keyboard","Gaming Keyboard"],
        ["gaming-headsets","Gaming Headsets"],
        ["gaming-accessories","Gaming Accessories"]
    ],

    beauty:[
        ["makeup","Makeup"],
        ["skincare","Skincare"],
        ["hair-care","Hair Care"],
        ["fragrances","Fragrances"],
        ["grooming","Grooming"],
        ["personal-care","Personal Care"]
    ],

    watches:[
        ["smart-watches","Smart Watches"],
        ["analog-watches","Analog Watches"],
        ["digital-watches","Digital Watches"]
    ],

    accessories:[
        ["sunglasses","Sunglasses"],
        ["wallets","Wallets"],
        ["bags","Bags"],
        ["jewellery","Jewellery"],
        ["accessories","Accessories"]
    ],

    grocery:[
        ["food","Food"],
        ["beverages","Beverages"],
        ["snacks","Snacks"],
        ["household-supplies","Household Supplies"],
        ["personal-care","Personal Care"],
        ["baby-care","Baby Care"]
    ],

    books:[
        ["books","Books"],
        ["educational","Educational Books"],
        ["stationery","Stationery"],
        ["office-supplies","Office Supplies"]
    ],

    toys:[
        ["toys","Toys"],
        ["games","Games"],
        ["baby-clothing","Baby Clothing"],
        ["baby-care","Baby Care"],
        ["kids-accessories","Kids Accessories"]
    ]

};


/* ==========================================
   CATEGORY → SUBCATEGORY
========================================== */

function updateSubcategories(){

    const category =
        document.getElementById(
            "category"
        ).value;

    const select =
        document.getElementById(
            "subcategory"
        );

    select.innerHTML =
        '<option value="">Select Subcategory</option>';


    if(!subcategories[category]){
        return;
    }


    subcategories[category]
    .forEach(item => {

        const option =
            document.createElement("option");

        option.value = item[0];

        option.textContent = item[1];

        select.appendChild(option);

    });

}


/* ==========================================
   DISCOUNT YES / NO
========================================== */

function toggleDiscount(show){

    const box =
        document.getElementById(
            "discountPercentBox"
        );

    const input =
        document.getElementById(
            "discountPercent"
        );


    if(show){

        box.style.display = "block";

        input.required = true;

    }else{

        box.style.display = "none";

        input.required = false;

        input.value = "";

    }

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

let selectedImage = "";


function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        selectedImage =
            e.target.result;


        document.getElementById(
            "imagePreview"
        ).innerHTML = `

            <img
                src="${selectedImage}"
                alt="Product"
            >

        `;

    };


    reader.readAsDataURL(file);

}


/* ==========================================
   ADD PRODUCT
========================================== */

document
.getElementById("productForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const seller =
            document.getElementById(
                "sellerName"
            ).value.trim();


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value;


        const sub =
            document.getElementById(
                "subcategory"
            ).value;


        const mrp =
            Number(
                document.getElementById(
                    "mrp"
                ).value
            );


        const sellingPrice =
            Number(
                document.getElementById(
                    "sellingPrice"
                ).value
            );


        const stock =
            Number(
                document.getElementById(
                    "stock"
                ).value
            );


        const icon =
            document.getElementById(
                "productIcon"
            ).value ||
            "🛍️";


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const discountEnabled =
            document.querySelector(
                'input[name="discount"]:checked'
            ).value === "yes";


        const discountPercent =
            discountEnabled
            ?
            Number(
                document.getElementById(
                    "discountPercent"
                ).value
            )
            :
            0;


        /* PRICE VALIDATION */

        if(mrp <= 0){

            alert(
                "Please enter a valid MRP."
            );

            return;

        }


        if(sellingPrice <= 0){

            alert(
                "Please enter a valid selling price."
            );

            return;

        }


        if(sellingPrice > mrp){

            alert(
                "Selling Price cannot be higher than MRP."
            );

            return;

        }


        /* DISCOUNT VALIDATION */

        if(discountEnabled){

            if(
                discountPercent <= 0 ||
                discountPercent > 100
            ){

                alert(
                    "Enter a discount between 1% and 100%."
                );

                return;

            }

        }


        /*
        Seller controls discount.
        We DO NOT calculate or change it.
        */


        let products =
            JSON.parse(
                localStorage.getItem(
                    "dealbrand_products"
                )
            ) || [];


        const product = {

            id:
                Date.now(),

            seller:
                seller,

            name:
                name,

            category:
                category,

            sub:
                sub,

            mrp:
                mrp,

            sellingPrice:
                sellingPrice,

            discountEnabled:
                discountEnabled,

            discountPercent:
                discountPercent,

            stock:
                stock,

            icon:
                icon,

            image:
                selectedImage,

            description:
                description,

            rating:
                "☆☆☆☆☆",

            createdAt:
                new Date().toISOString()

        };


        products.push(product);


        localStorage.setItem(
            "dealbrand_products",
            JSON.stringify(products)
        );


        document.getElementById(
            "message"
        ).style.display = "block";


        document.getElementById(
            "message"
        ).innerText =
        "✅ Product added successfully!";


        document
        .getElementById("productForm")
        .reset();


        document.getElementById(
            "productIcon"
        ).value = "🛍️";


        document.getElementById(
            "imagePreview"
        ).innerHTML = "🖼️";


        document.getElementById(
            "discountPercentBox"
        ).style.display = "none";


        selectedImage = "";


        updateSubcategories();

        displaySellerProducts();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* ==========================================
   SELLER PRODUCT LIST
========================================== */

function displaySellerProducts(){

    const box =
        document.getElementById(
            "sellerProducts"
        );


    const products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    if(products.length === 0){

        box.innerHTML = `

            <p>
                No products added yet.
            </p>

        `;

        return;

    }


    box.innerHTML =
        products
        .map(product => {

            let discountText = "";

            if(
                product.discountEnabled &&
                product.discountPercent > 0
            ){

                discountText =
                `<div style="color:green;">
                    ${product.discountPercent}% OFF
                </div>`;

            }


            return `

            <div class="seller-product">

                <div class="seller-product-icon">

                    ${
                        product.image
                        ?
                        `<img
                            src="${product.image}"
                            style="
                            width:100%;
                            height:120px;
                            object-fit:cover;
                            border-radius:6px;
                            "
                        >`
                        :
                        product.icon
                    }

                </div>


                <h3>
                    ${product.name}
                </h3>


                <p>
                    Seller:
                    ${product.seller}
                </p>


                <p>
                    MRP:
                    ₹${product.mrp.toLocaleString("en-IN")}
                </p>


                <div class="product-price">

                    ₹${product.sellingPrice
                    .toLocaleString("en-IN")}

                </div>


                ${discountText}


                <p>
                    Stock:
                    ${product.stock}
                </p>


                <button
                    class="delete-btn"
                    onclick="deleteProduct(${product.id})"
                >
                    🗑️ Delete
                </button>

            </div>

            `;

        })
        .join("");

}


/* ==========================================
   DELETE PRODUCT
========================================== */

function deleteProduct(id){

    if(
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ){

        return;

    }


    let products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    products =
        products.filter(
            product =>
            product.id != id
        );


    localStorage.setItem(
        "dealbrand_products",
        JSON.stringify(products)
    );


    displaySellerProducts();

}


/* ==========================================
   START
========================================== */

displaySellerProducts();

</script>

</body>
</html>
