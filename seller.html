<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealBrand Seller Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#2874f0;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-right{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.header-right a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:1150px;
    margin:25px auto;
}

.dashboard-title{
    margin-bottom:20px;
}

.dashboard-title h1{
    font-size:28px;
}

.dashboard-title p{
    color:#666;
    margin-top:5px;
}


/* =========================
   DASHBOARD STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-icon{
    font-size:30px;
    margin-bottom:8px;
}

.stat-card h3{
    font-size:25px;
    margin-bottom:4px;
}

.stat-card p{
    color:#666;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    padding:22px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.card h2{
    margin-bottom:18px;
}


/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    outline:none;
    font-size:15px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2874f0;
}

textarea{
    min-height:100px;
    resize:vertical;
}


/* =========================
   DISCOUNT
========================= */

.discount-box{
    background:#f7faff;
    padding:15px;
    border-radius:8px;
    border:1px solid #e1e8f5;
}

.discount-options{
    display:flex;
    gap:20px;
    margin-top:8px;
}

.discount-options label{
    font-weight:normal;
}

.discount-percent{
    margin-top:12px;
    display:none;
}


/* =========================
   IMAGE
========================= */

.image-preview{
    width:120px;
    height:120px;
    background:#f2f2f2;
    border-radius:8px;
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:45px;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   BUTTONS
========================= */

.submit-btn{
    width:100%;
    padding:14px;
    background:#2874f0;
    color:white;
    border:0;
    border-radius:6px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:hover{
    background:#1765df;
}

.cancel-btn{
    display:none;
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#777;
    color:white;
    border:0;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
    background:#e8f7e8;
    color:#147a14;
    font-weight:bold;
}


/* =========================
   PRODUCTS
========================= */

.products-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.seller-product{
    border:1px solid #eee;
    border-radius:8px;
    padding:15px;
    background:white;
}

.seller-product-image{
    width:100%;
    height:150px;
    background:#f4f4f4;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:55px;
    margin-bottom:12px;
}

.seller-product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.seller-product h3{
    margin-bottom:7px;
}

.product-price{
    font-weight:bold;
    font-size:18px;
    margin-top:5px;
}

.old-price{
    color:#888;
    text-decoration:line-through;
    font-size:14px;
    margin-top:5px;
}

.category-text{
    color:#2874f0;
    font-size:14px;
    margin:5px 0;
}

.stock-text{
    margin-top:7px;
}

.edit-btn,
.delete-btn{
    margin-top:10px;
    width:100%;
    padding:9px;
    border:0;
    border-radius:5px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn{
    background:#ff9800;
}

.edit-btn:hover{
    background:#e68900;
}

.delete-btn{
    background:#e53935;
}

.delete-btn:hover{
    background:#c62828;
}

.empty{
    color:#777;
    padding:10px 0;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        padding:15px 4%;
    }

    .container{
        width:94%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-card h3{
        font-size:21px;
    }

    .header-right{
        font-size:13px;
    }

}
</style>
</head>


<body>


<header>

    <div class="logo">
        DealBrand Seller
    </div>

    <div class="header-right">
        <a href="products.html">Products</a>
        <a href="index.html">Home</a>
    </div>

</header>


<div class="container">


    <div class="dashboard-title">

        <h1>Seller Dashboard</h1>

        <p>
            Add and manage your products on DealBrand
        </p>

    </div>


    <!-- =========================
         STATS
    ========================== -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                🛍️
            </div>

            <h3 id="totalProducts">
                0
            </h3>

            <p>
                Total Products
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <h3 id="totalStock">
                0
            </h3>

            <p>
                Total Stock
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <h3 id="totalSales">
                ₹0
            </h3>

            <p>
                Total Sales
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🛒
            </div>

            <h3 id="totalOrders">
                0
            </h3>

            <p>
                Total Orders
            </p>

        </div>

    </div>


    <div id="message" class="message">
        Product added successfully!
    </div>


    <!-- =========================
         ADD / EDIT PRODUCT
    ========================== -->

    <div class="card">

        <h2 id="formTitle">
            ➕ Add New Product
        </h2>


        <form id="productForm">

            <div class="form-grid">


                <!-- SELLER -->

                <div class="form-group">

                    <label>
                        Seller Name
                    </label>

                    <input
                        type="text"
                        id="sellerName"
                        placeholder="Enter seller name"
                        required
                    >

                </div>


                <!-- PRODUCT NAME -->

                <div class="form-group">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select
                        id="category"
                        onchange="updateSubcategories()"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="smartphones">
                            Mobiles & Tablets
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="fashion">
                            Fashion
                        </option>

                        <option value="shoes">
                            Footwear
                        </option>

                        <option value="home">
                            Home & Kitchen
                        </option>

                        <option value="gaming">
                            Gaming
                        </option>

                        <option value="beauty">
                            Beauty
                        </option>

                        <option value="watches">
                            Watches
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="grocery">
                            Grocery
                        </option>

                        <option value="books">
                            Books
                        </option>

                        <option value="toys">
                            Toys
                        </option>

                    </select>

                </div>


                <!-- SUBCATEGORY -->

                <div class="form-group">

                    <label>
                        Subcategory
                    </label>

                    <select
                        id="subcategory"
                        required
                    >

                        <option value="">
                            Select Category First
                        </option>

                    </select>

                </div>


                <!-- MRP -->

                <div class="form-group">

                    <label>
                        MRP ₹
                    </label>

                    <input
                        type="number"
                        id="mrp"
                        min="0"
                        step="0.01"
                        placeholder="Seller enters MRP"
                        required
                    >

                </div>


                <!-- SELLING PRICE -->

                <div class="form-group">

                    <label>
                        Selling Price ₹
                    </label>

                    <input
                        type="number"
                        id="sellingPrice"
                        min="0"
                        step="0.01"
                        placeholder="Seller enters selling price"
                        required
                    >

                </div>


                <!-- DISCOUNT -->

                <div class="form-group full">

                    <div class="discount-box">

                        <label>
                            Discount
                        </label>

                        <div class="discount-options">

                            <label>
                                <input
                                    type="radio"
                                    name="discount"
                                    value="yes"
                                    onchange="toggleDiscount(true)"
                                >
                                Yes
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="discount"
                                    value="no"
                                    checked
                                    onchange="toggleDiscount(false)"
                                >
                                No
                            </label>

                        </div>


                        <div
                            id="discountPercentBox"
                            class="discount-percent"
                        >

                            <label>
                                Discount Percentage %
                            </label>

                            <input
                                type="number"
                                id="discountPercent"
                                min="1"
                                max="100"
                                placeholder="Example: 20"
                            >

                        </div>

                    </div>

                </div>


                <!-- STOCK -->

                <div class="form-group">

                    <label>
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        placeholder="Available stock"
                        required
                    >

                </div>


                <!-- ICON -->

                <div class="form-group">

                    <label>
                        Product Icon
                    </label>

                    <input
                        type="text"
                        id="productIcon"
                        maxlength="4"
                        placeholder="Example: 📱"
                        value="🛍️"
                    >

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group full">

                    <label>
                        Product Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Write product details..."
                    ></textarea>

                </div>


                <!-- IMAGE -->

                <div class="form-group full">

                    <label>
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                        onchange="previewImage(event)"
                    >

                    <div
                        id="imagePreview"
                        class="image-preview"
                    >
                        🖼️
                    </div>

                </div>


                <!-- SUBMIT -->

                <div class="form-group full">

                    <button
                        type="submit"
                        id="submitBtn"
                        class="submit-btn"
                    >
                        ➕ Add Product
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        onclick="cancelEdit()"
                    >
                        Cancel Edit
                    </button>

                </div>


            </div>

        </form>

    </div>


    <!-- =========================
         MY PRODUCTS
    ========================== -->

    <div class="card">

        <h2>
            📦 My Products
        </h2>

        <div
            id="sellerProducts"
            class="products-list"
        ></div>

    </div>


</div>


<script>


/* ==========================================
   SUBCATEGORY DATA
========================================== */

const subcategories = {

    smartphones:[
        ["smartphones","Smartphones"],
        ["feature-phones","Feature Phones"],
        ["tablets","Tablets"],
        ["chargers","Chargers"],
        ["power-banks","Power Banks"],
        ["earphones","Earphones"],
        ["cases","Cases & Covers"]
    ],

    electronics:[
        ["laptops","Laptops"],
        ["computers","Computers"],
        ["monitors","Monitors"],
        ["headphones","Headphones"],
        ["speakers","Speakers"],
        ["cameras","Cameras"],
        ["televisions","Televisions"],
        ["printers","Printers"]
    ],

    fashion:[
        ["men","Men"],
        ["women","Women"],
        ["kids","Kids"],
        ["tshirts","T-Shirts"],
        ["shirts","Shirts"],
        ["jeans","Jeans"],
        ["ethnic","Ethnic Wear"],
        ["winter","Winter Wear"]
    ],

    shoes:[
        ["mens-shoes","Men's Shoes"],
        ["womens-shoes","Women's Shoes"],
        ["sports-shoes","Sports Shoes"],
        ["sneakers","Sneakers"],
        ["sandals","Sandals"],
        ["slippers","Slippers"],
        ["formal-shoes","Formal Shoes"],
        ["kids-footwear","Kids Footwear"]
    ],

    home:[
        ["kitchen","Kitchen"],
        ["cookware","Cookware"],
        ["home-decor","Home Decor"],
        ["furniture","Furniture"],
        ["bedsheets","Bedsheets"],
        ["curtains","Curtains"],
        ["storage","Storage"],
        ["cleaning","Cleaning"]
    ],

    gaming:[
        ["gaming-consoles","Gaming Consoles"],
        ["controllers","Controllers"],
        ["gaming-mouse","Gaming Mouse"],
        ["gaming-keyboard","Gaming Keyboard"],
        ["gaming-headsets","Gaming Headsets"],
        ["gaming-accessories","Gaming Accessories"]
    ],

    beauty:[
        ["makeup","Makeup"],
        ["skincare","Skincare"],
        ["hair-care","Hair Care"],
        ["fragrances","Fragrances"],
        ["grooming","Grooming"],
        ["personal-care","Personal Care"]
    ],

    watches:[
        ["smart-watches","Smart Watches"],
        ["analog-watches","Analog Watches"],
        ["digital-watches","Digital Watches"]
    ],

    accessories:[
        ["sunglasses","Sunglasses"],
        ["wallets","Wallets"],
        ["bags","Bags"],
        ["jewellery","Jewellery"],
        ["accessories","Accessories"]
    ],

    grocery:[
        ["food","Food"],
        ["beverages","Beverages"],
        ["snacks","Snacks"],
        ["household-supplies","Household Supplies"],
        ["personal-care","Personal Care"],
        ["baby-care","Baby Care"]
    ],

    books:[
        ["books","Books"],
        ["educational","Educational Books"],
        ["stationery","Stationery"],
        ["office-supplies","Office Supplies"]
    ],

    toys:[
        ["toys","Toys"],
        ["games","Games"],
        ["baby-clothing","Baby Clothing"],
        ["baby-care","Baby Care"],
        ["kids-accessories","Kids Accessories"]
    ]

};


/* ==========================================
   EDIT MODE
========================================== */

let editingProductId = null;

let selectedImage = "";


/* ==========================================
   SUBCATEGORY
========================================== */

function updateSubcategories(selectedValue=""){

    const category =
        document.getElementById("category").value;

    const select =
        document.getElementById("subcategory");

    select.innerHTML =
        '<option value="">Select Subcategory</option>';


    if(!subcategories[category]){
        return;
    }


    subcategories[category].forEach(item => {

        const option =
            document.createElement("option");

        option.value = item[0];

        option.textContent = item[1];

        if(item[0] === selectedValue){
            option.selected = true;
        }

        select.appendChild(option);

    });

}


/* ==========================================
   DISCOUNT
========================================== */

function toggleDiscount(show){

    const box =
        document.getElementById(
            "discountPercentBox"
        );

    const input =
        document.getElementById(
            "discountPercent"
        );


    if(show){

        box.style.display = "block";

        input.required = true;

    }else{

        box.style.display = "none";

        input.required = false;

        input.value = "";

    }

}


/* ==========================================
   IMAGE PREVIEW
========================================== */

function previewImage(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        selectedImage =
            e.target.result;


        document.getElementById(
            "imagePreview"
        ).innerHTML = `

            <img
                src="${selectedImage}"
                alt="Product"
            >

        `;

    };


    reader.readAsDataURL(file);

}


/* ==========================================
   FORM SUBMIT
========================================== */

document
.getElementById("productForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const seller =
            document.getElementById(
                "sellerName"
            ).value.trim();


        const name =
            document.getElementById(
                "productName"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value;


        const sub =
            document.getElementById(
                "subcategory"
            ).value;


        const mrp =
            Number(
                document.getElementById(
                    "mrp"
                ).value
            );


        const sellingPrice =
            Number(
                document.getElementById(
                    "sellingPrice"
                ).value
            );


        const stock =
            Number(
                document.getElementById(
                    "stock"
                ).value
            );


        const icon =
            document.getElementById(
                "productIcon"
            ).value ||
            "🛍️";


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const discountEnabled =
            document.querySelector(
                'input[name="discount"]:checked'
            ).value === "yes";


        const discountPercent =
            discountEnabled
            ?
            Number(
                document.getElementById(
                    "discountPercent"
                ).value
            )
            :
            0;


        /* VALIDATION */

        if(!seller){
            alert("Please enter seller name.");
            return;
        }


        if(!name){
            alert("Please enter product name.");
            return;
        }


        if(mrp <= 0){
            alert("Please enter a valid MRP.");
            return;
        }


        if(sellingPrice <= 0){
            alert("Please enter a valid selling price.");
            return;
        }


        if(sellingPrice > mrp){

            alert(
                "Selling Price cannot be higher than MRP."
            );

            return;

        }


        if(stock < 0){

            alert(
                "Stock cannot be negative."
            );

            return;

        }


        if(discountEnabled){

            if(
                discountPercent <= 0 ||
                discountPercent > 100
            ){

                alert(
                    "Enter a discount between 1% and 100%."
                );

                return;

            }

        }


        let products =
            JSON.parse(
                localStorage.getItem(
                    "dealbrand_products"
                )
            ) || [];


        /* =================================
           EDIT EXISTING PRODUCT
        ================================= */

        if(editingProductId !== null){

            const index =
                products.findIndex(
                    product =>
                    String(product.id) ===
                    String(editingProductId)
                );


            if(index !== -1){

                products[index] = {

                    ...products[index],

                    seller:
                        seller,

                    name:
                        name,

                    category:
                        category,

                    sub:
                        sub,

                    mrp:
                        mrp,

                    sellingPrice:
                        sellingPrice,

                    discountEnabled:
                        discountEnabled,

                    discountPercent:
                        discountPercent,

                    stock:
                        stock,

                    icon:
                        icon,

                    image:
                        selectedImage ||
                        products[index].image ||
                        "",

                    description:
                        description

                };

            }


            localStorage.setItem(
                "dealbrand_products",
                JSON.stringify(products)
            );


            showMessage(
                "✅ Product updated successfully!"
            );


            cancelEdit();


            displaySellerProducts();

            updateStats();

            return;

        }


        /* =================================
           ADD NEW PRODUCT
        ================================= */

        const product = {

            id:
                Date.now(),

            seller:
                seller,

            name:
                name,

            category:
                category,

            sub:
                sub,

            mrp:
                mrp,

            sellingPrice:
                sellingPrice,

            discountEnabled:
                discountEnabled,

            discountPercent:
                discountPercent,

            stock:
                stock,

            icon:
                icon,

            image:
                selectedImage,

            description:
                description,

            rating:
                "☆☆☆☆☆",

            createdAt:
                new Date().toISOString()

        };


        products.push(product);


        localStorage.setItem(
            "dealbrand_products",
            JSON.stringify(products)
        );


        showMessage(
            "✅ Product added successfully!"
        );


        resetForm();


        displaySellerProducts();

        updateStats();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );

    message.innerText = text;

    message.style.display = "block";


    setTimeout(function(){

        message.style.display = "none";

    },3000);

}


/* ==========================================
   DISPLAY PRODUCTS
========================================== */

function displaySellerProducts(){

    const box =
        document.getElementById(
            "sellerProducts"
        );


    const products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    if(products.length === 0){

        box.innerHTML = `

            <div class="empty">
                No products added yet.
            </div>

        `;

        return;

    }


    box.innerHTML =
        products
        .map(product => {


            let discountText = "";


            if(
                product.discountEnabled &&
                product.discountPercent > 0
            ){

                discountText = `

                    <div style="color:green;font-weight:bold;">
                        ${product.discountPercent}% OFF
                    </div>

                `;

            }


            return `

            <div class="seller-product">

                <div class="seller-product-image">

                    ${
                        product.image

                        ?

                        `<img
                            src="${product.image}"
                            alt="${product.name}"
                        >`

                        :

                        product.icon || "🛍️"
                    }

                </div>


                <h3>
                    ${product.name}
                </h3>


                <p>
                    Seller:
                    ${product.seller}
                </p>


                <div class="category-text">
                    ${product.category}
                    →
                    ${product.sub}
                </div>


                <div class="old-price">
                    MRP:
                    ₹${Number(product.mrp || 0)
                    .toLocaleString("en-IN")}
                </div>


                <div class="product-price">
                    ₹${Number(product.sellingPrice || 0)
                    .toLocaleString("en-IN")}
                </div>


                ${discountText}


                <div class="stock-text">
                    📦 Stock:
                    ${Number(product.stock || 0)}
                </div>


                <button
                    class="edit-btn"
                    onclick="editProduct('${product.id}')"
                >
                    ✏️ Edit Product
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteProduct('${product.id}')"
                >
                    🗑️ Delete
                </button>

            </div>

            `;

        })
        .join("");

}


/* ==========================================
   EDIT PRODUCT
========================================== */

function editProduct(id){

    const products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    const product =
        products.find(
            item =>
            String(item.id) ===
            String(id)
        );


    if(!product){
        alert("Product not found.");
        return;
    }


    editingProductId =
        product.id;


    document.getElementById(
        "formTitle"
    ).innerText =
        "✏️ Edit Product";


    document.getElementById(
        "submitBtn"
    ).innerText =
        "💾 Save Changes";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    document.getElementById(
        "sellerName"
    ).value =
        product.seller || "";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "category"
    ).value =
        product.category || "";


    updateSubcategories(
        product.sub || ""
    );


    document.getElementById(
        "mrp"
    ).value =
        product.mrp || "";


    document.getElementById(
        "sellingPrice"
    ).value =
        product.sellingPrice || "";


    document.getElementById(
        "stock"
    ).value =
        product.stock || 0;


    document.getElementById(
        "productIcon"
    ).value =
        product.icon || "🛍️";


    document.getElementById(
        "description"
    ).value =
        product.description || "";


    if(product.discountEnabled){

        document.querySelector(
            'input[name="discount"][value="yes"]'
        ).checked = true;


        document.getElementById(
            "discountPercent"
        ).value =
            product.discountPercent || "";


        toggleDiscount(true);

    }else{

        document.querySelector(
            'input[name="discount"][value="no"]'
        ).checked = true;


        toggleDiscount(false);

    }


    selectedImage =
        product.image || "";


    if(product.image){

        document.getElementById(
            "imagePreview"
        ).innerHTML = `

            <img
                src="${product.image}"
                alt="Product"
            >

        `;

    }else{

        document.getElementById(
            "imagePreview"
        ).innerHTML =
            product.icon || "🖼️";

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================
   CANCEL EDIT
========================================== */

function cancelEdit(){

    editingProductId = null;

    document.getElementById(
        "formTitle"
    ).innerText =
        "➕ Add New Product";


    document.getElementById(
        "submitBtn"
    ).innerText =
        "➕ Add Product";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";


    resetForm();

}


/* ==========================================
   RESET FORM
========================================== */

function resetForm(){

    document
    .getElementById("productForm")
    .reset();


    document.getElementById(
        "productIcon"
    ).value =
        "🛍️";


    document.getElementById(
        "imagePreview"
    ).innerHTML =
        "🖼️";


    document.getElementById(
        "discountPercentBox"
    ).style.display =
        "none";


    document.getElementById(
        "discountPercent"
    ).required =
        false;


    document.getElementById(
        "subcategory"
    ).innerHTML =
        '<option value="">Select Category First</option>';


    selectedImage = "";

}


/* ==========================================
   DELETE PRODUCT
========================================== */

function deleteProduct(id){

    if(
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ){

        return;

    }


    let products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    products =
        products.filter(
            product =>
            String(product.id) !==
            String(id)
        );


    localStorage.setItem(
        "dealbrand_products",
        JSON.stringify(products)
    );


    if(
        String(editingProductId) ===
        String(id)
    ){

        cancelEdit();

    }


    displaySellerProducts();

    updateStats();

}


/* ==========================================
   DASHBOARD STATS
========================================== */

function updateStats(){

    const products =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_products"
            )
        ) || [];


    /* TOTAL PRODUCTS */

    document.getElementById(
        "totalProducts"
    ).innerText =
        products.length;


    /* TOTAL STOCK */

    const stock =
        products.reduce(
            (sum,product) =>
            sum +
            Number(product.stock || 0),
            0
        );


    document.getElementById(
        "totalStock"
    ).innerText =
        stock;


    /*
       Sales and Orders will become real
       after our order/payment backend
       is connected.
    */

    const orders =
        JSON.parse(
            localStorage.getItem(
                "dealbrand_orders"
            )
        ) || [];


    document.getElementById(
        "totalOrders"
    ).innerText =
        orders.length;


    const sales =
        orders.reduce(
            (sum,order) =>
            sum +
            Number(order.total || 0),
            0
        );


    document.getElementById(
        "totalSales"
    ).innerText =
        "₹" +
        sales.toLocaleString("en-IN");

}


/* ==========================================
   START
========================================== */

displaySellerProducts();

updateStats();

</script>

</body>
</html>
