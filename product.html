<title>DealBrand - Products</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

/* HEADER */
header{
    background:#131921;
    color:white;
    padding:12px 5%;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ffcc00;
    text-decoration:none;
}

.search{
    flex:1;
    min-width:220px;
}

.search input{
    width:100%;
    padding:12px;
    border:0;
    border-radius:5px;
    font-size:15px;
}

.cart{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* NAV */
.nav{
    background:#232f3e;
    padding:12px 5%;
    display:flex;
    gap:22px;
    overflow-x:auto;
}

.nav a{
    color:white;
    text-decoration:none;
    white-space:nowrap;
}

/* PAGE */
.container{
    max-width:1250px;
    margin:25px auto;
    padding:0 15px;
}

.topbar{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.topbar h1{
    margin-bottom:8px;
}

.topbar p{
    color:#666;
}

/* CATEGORY BUTTONS */
.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-top:15px;
}

.categories button{
    border:1px solid #ddd;
    background:white;
    padding:10px 16px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
}

.categories button:hover{
    background:#ffcc00;
}

/* PRODUCTS */
.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product{
    background:white;
    border-radius:10px;
    padding:15px;
    transition:.2s;
    position:relative;
}

.product:hover{
    transform:translateY(-3px);
    box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.product-image{
    height:190px;
    background:#f3f3f3;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
    margin-bottom:15px;
}

.product h3{
    font-size:17px;
    margin-bottom:8px;
}

.rating{
    color:#f39c12;
    font-size:14px;
    margin-bottom:8px;
}

.price{
    font-size:21px;
    font-weight:bold;
    color:#d35400;
}

.old{
    color:#888;
    text-decoration:line-through;
    font-size:14px;
    margin-left:5px;
}

.discount{
    color:green;
    font-size:13px;
    margin:5px 0 12px;
}

.buttons{
    display:flex;
    gap:8px;
}

.buttons button{
    flex:1;
    border:0;
    padding:10px 5px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#ffd814;
}

.buy{
    background:#ff9900;
}

.no-products{
    background:white;
    padding:50px;
    text-align:center;
    border-radius:10px;
}

/* MOBILE */
@media(max-width:900px){
    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:650px){
    .product-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product{
        padding:10px;
    }

    .product-image{
        height:150px;
        font-size:65px;
    }

    .product h3{
        font-size:15px;
    }

    .price{
        font-size:18px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

/* =========================
   DISPLAY PRODUCTS
========================= */

let currentCategory = "all";

function displayProducts(list){

const grid = document.getElementById("productGrid");

grid.innerHTML = "";

if(list.length === 0){

grid.innerHTML = `
<div class="no-products">
<h2>😕 No products found</h2>
<p>Try another search or category.</p>
</div>
`;

return;
}

list.forEach((product,index)=>{

grid.innerHTML += `

<div class="product">

<div class="product-image">
${product.icon}
</div>

<h3>${product.name}</h3>

<div class="rating">
${product.rating}
</div>

<div class="price">
₹${product.price.toLocaleString("en-IN")}
<span class="old">
₹${product.old.toLocaleString("en-IN")}
</span>
</div>

<div class="discount">
${product.discount}
</div>

<div class="buttons">

<button class="add"
onclick="addToCart(${index}, '${product.name.replace(/'/g,"\\'")}')">
🛒 Add to Cart
</button>

<button class="buy"
onclick="buyNow(${index})">
⚡ Buy
</button>

</div>

</div>

`;

});

}


/* =========================
   CATEGORY
========================= */

function showCategory(category){

currentCategory = category;

let filtered;

if(category === "all"){
filtered = products;
document.getElementById("pageTitle").innerText =
"All Products";
document.getElementById("pageDescription").innerText =
"Explore all DealBrand products";
}else{

filtered = products.filter(
product => product.category === category
);

let names = {
smartphones:"Smartphones",
headphones:"Headphones",
tshirts:"T-Shirts",
shoes:"Shoes",
watches:"Watches",
gaming:"Gaming",
kitchen:"Home & Kitchen",
beauty:"Beauty"
};

document.getElementById("pageTitle").innerText =
names[category] || "Products";

document.getElementById("pageDescription").innerText =
"Best deals on " + (names[category] || "products");

}

displayProducts(filtered);

}


/* =========================
   SEARCH
========================= */

function searchProducts(){

let value =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

let filtered = products.filter(product => {

let matchText =
product.name.toLowerCase().includes(value);

let matchCategory =
currentCategory === "all" ||
product.category === currentCategory;

return matchText && matchCategory;

});

displayProducts(filtered);

}


/* =========================
   CART
========================= */

function addToCart(index){

let product = products[index];

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let existing =
cart.find(item => item.name === product.name);

if(existing){

existing.quantity =
(Number(existing.quantity) || 1) + 1;

}else{

cart.push({

name:product.name,

price:product.price,

icon:product.icon,

quantity:1

});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

updateCartCount();

alert("✅ " + product.name + " added to cart!");

}


/* =========================
   BUY NOW
========================= */

function buyNow(index){

let product = products[index];

let cart = [{
name:product.name,
price:product.price,
icon:product.icon,
quantity:1
}];

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

window.location.href="checkout.html";

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let total = 0;

cart.forEach(item=>{

total += Number(item.quantity) || 1;

});

document.getElementById("cartCount").innerText = total;

}


/* =========================
   URL CATEGORY
========================= */

function loadFromURL(){

const params =
new URLSearchParams(window.location.search);

const category =
params.get("category");

if(category){

showCategory(category);

}else{

displayProducts(products);

}

}


/* START */

loadFromURL();

updateCartCount();
