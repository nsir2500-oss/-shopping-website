<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBrand - Products</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#222;
}

header{
    background:#2874f0;
    color:white;
    padding:14px 5%;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.search{
    flex:1;
    min-width:220px;
    display:flex;
}

.search input{
    width:100%;
    padding:12px;
    border:0;
    outline:0;
    border-radius:4px 0 0 4px;
}

.search button{
    padding:12px 18px;
    border:0;
    background:#ff9f00;
    color:white;
    cursor:pointer;
}

.cart{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav{
    background:white;
    padding:13px 5%;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    display:flex;
    gap:22px;
    flex-wrap:wrap;
}

nav a{
    color:#333;
    text-decoration:none;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:1400px;
    margin:25px auto;
}

.title{
    margin-bottom:18px;
}

.title h1{
    font-size:28px;
}

.title p{
    color:#666;
    margin-top:6px;
}

.filters{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.filter{
    background:white;
    border:1px solid #ddd;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
}

.filter.active,
.filter:hover{
    background:#2874f0;
    color:white;
    border-color:#2874f0;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:18px;
}

.product{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product-image{
    height:190px;
    background:#f8f8f8;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
}

.product-info{
    padding:14px;
}

.product h3{
    font-size:16px;
    min-height:40px;
}

.sub{
    color:#777;
    font-size:13px;
    margin:6px 0;
}

.seller{
    color:#666;
    font-size:12px;
    margin-bottom:5px;
}

.price{
    font-size:20px;
    font-weight:bold;
    margin-top:8px;
}

.mrp{
    color:#999;
    text-decoration:line-through;
    font-size:13px;
    margin-left:5px;
}

.discount{
    color:#008000;
    font-size:13px;
    font-weight:bold;
    margin-top:4px;
}

.rating{
    color:#f59e0b;
    font-size:14px;
    margin-top:5px;
}

.buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.buttons button{
    flex:1;
    padding:10px 5px;
    border:0;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#ff9f00;
    color:white;
}

.buy{
    background:#2874f0;
    color:white;
}

.no-products{
    background:white;
    padding:55px 20px;
    text-align:center;
    border-radius:10px;
    grid-column:1/-1;
}

.no-products h2{
    margin-bottom:8px;
}

@media(max-width:600px){

    header{
        padding:12px 3%;
    }

    nav{
        padding:12px 3%;
        gap:13px;
        font-size:14px;
    }

    .container{
        width:94%;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:145px;
        font-size:55px;
    }

    .product-info{
        padding:10px;
    }

    .product h3{
        font-size:14px;
    }

    .price{
        font-size:17px;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">DealBrand</div>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >
        <button onclick="searchProducts()">Search</button>
    </div>

    <a href="cart.html" class="cart">
        🛒 Cart (<span id="cartCount">0</span>)
    </a>

</header>

<nav>
    <a href="index.html">Home</a>
    <a href="categories.html">Categories</a>
    <a href="products.html">Products</a>
    <a href="wishlist.html">❤️ Wishlist</a>
    <a href="orders.html">My Orders</a>
</nav>

<div class="container">

    <div class="title">
        <h1 id="pageTitle">All Products</h1>
        <p id="pageSubtitle">
            Products listed by DealBrand sellers
        </p>
    </div>

    <div class="filters">

        <button class="filter active"
        onclick="showCategory('all',this)">
        All
        </button>

        <button class="filter"
        onclick="showCategory('smartphones',this)">
        📱 Mobiles
        </button>

        <button class="filter"
        onclick="showCategory('electronics',this)">
        💻 Electronics
        </button>

        <button class="filter"
        onclick="showCategory('fashion',this)">
        👕 Fashion
        </button>

        <button class="filter"
        onclick="showCategory('shoes',this)">
        👟 Shoes
        </button>

        <button class="filter"
        onclick="showCategory('home',this)">
        🏠 Home
        </button>

        <button class="filter"
        onclick="showCategory('gaming',this)">
        🎮 Gaming
        </button>

        <button class="filter"
        onclick="showCategory('beauty',this)">
        💄 Beauty
        </button>

        <button class="filter"
        onclick="showCategory('watches',this)">
        ⌚ Watches
        </button>

        <button class="filter"
        onclick="showCategory('accessories',this)">
        👜 Accessories
        </button>

        <button class="filter"
        onclick="showCategory('grocery',this)">
        🛒 Grocery
        </button>

        <button class="filter"
        onclick="showCategory('books',this)">
        📚 Books
        </button>

        <button class="filter"
        onclick="showCategory('toys',this)">
        🧸 Toys
        </button>

    </div>

    <div id="products" class="products"></div>

</div>

<script>

/*
====================================================
DEALBRAND PRODUCT SYSTEM
====================================================

IMPORTANT:

Price seller set karega.

Seller:
- MRP
- Selling Price
- Discount ON/OFF
- Discount %

khud decide karega.

App koi fixed price ya compulsory discount
set nahi karega.

====================================================
*/


let products = JSON.parse(
    localStorage.getItem("dealbrand_products")
) || [];


/*
Demo products intentionally EMPTY.

Actual products Seller Dashboard se
add honge.
*/


let currentCategory = "all";
let currentSub = "all";


function updateCartCount(){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let total = 0;

    cart.forEach(item => {
        total += Number(item.quantity) || 1;
    });

    document.getElementById("cartCount").innerText = total;
}


function addToCart(id){

    let product =
        products.find(item => item.id == id);

    if(!product) return;

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let existing =
        cart.find(item => item.name === product.name);

    if(existing){

        existing.quantity =
            (Number(existing.quantity) || 1) + 1;

    }else{

        cart.push({

            name:product.name,

            price:Number(product.sellingPrice),

            icon:product.icon || "🛍️",

            quantity:1

        });

    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCartCount();

    alert(
        "✅ " +
        product.name +
        " added to cart!"
    );
}


function buyNow(id){

    let product =
        products.find(item => item.id == id);

    if(!product) return;

    let cart = [{

        name:product.name,

        price:Number(product.sellingPrice),

        icon:product.icon || "🛍️",

        quantity:1

    }];

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    window.location.href =
        "checkout.html";
}


function displayProducts(list){

    const box =
        document.getElementById("products");

    if(list.length === 0){

        box.innerHTML = `

        <div class="no-products">

            <h2>🛍️ No Products Yet</h2>

            <p>
            Products added by sellers will appear here.
            </p>

        </div>

        `;

        return;
    }


    box.innerHTML = list.map(product => {

        let price =
            Number(product.sellingPrice) || 0;

        let mrp =
            Number(product.mrp) || 0;

        let discountHTML = "";

        /*
        Discount sirf tab show hoga
        jab seller ne discount ON kiya ho.
        */

        if(
            product.discountEnabled === true &&
            Number(product.discountPercent) > 0
        ){

            discountHTML = `

            <div class="discount">
                ${Number(product.discountPercent)}% OFF
            </div>

            `;

        }


        let mrpHTML = "";

        if(mrp > price && mrp > 0){

            mrpHTML = `

            <span class="mrp">
                ₹${mrp.toLocaleString("en-IN")}
            </span>

            `;

        }


        return `

        <div class="product">

            <div class="product-image">
                ${product.icon || "🛍️"}
            </div>

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="sub">
                    ${(product.sub || "")
                    .replaceAll("-"," ")}
                </div>

                <div class="seller">
                    Seller: ${product.seller || "DealBrand Seller"}
                </div>

                <div class="rating">
                    ${product.rating || "☆☆☆☆☆"}
                </div>

                <div class="price">

                    ₹${price.toLocaleString("en-IN")}

                    ${mrpHTML}

                </div>

                ${discountHTML}

                <div class="buttons">

                    <button
                    class="add"
                    onclick="addToCart(${product.id})">
                    🛒 Add
                    </button>

                    <button
                    class="buy"
                    onclick="buyNow(${product.id})">
                    Buy Now
                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("");
}


function showCategory(
    category,
    button = null
){

    currentCategory = category;

    currentSub = "all";

    let list;


    if(category === "all"){

        list = products;

        document.getElementById(
            "pageTitle"
        ).innerText = "All Products";

        document.getElementById(
            "pageSubtitle"
        ).innerText =
        "Products listed by DealBrand sellers";

    }else{

        list =
            products.filter(
                product =>
                product.category === category
            );

        document.getElementById(
            "pageTitle"
        ).innerText =
        categoryName(category);

        document.getElementById(
            "pageSubtitle"
        ).innerText =
        "Products in this category";
    }


    document.querySelectorAll(".filter")
    .forEach(btn => {

        btn.classList.remove("active");

    });


    if(button){

        button.classList.add("active");

    }


    document.getElementById(
        "searchInput"
    ).value = "";


    displayProducts(list);
}


function showSubcategory(sub){

    currentSub = sub;

    let list =
        products.filter(
            product =>
            product.sub === sub
        );


    document.getElementById(
        "pageTitle"
    ).innerText =
        sub
        .replaceAll("-"," ")
        .replace(/\b\w/g,l =>
        l.toUpperCase());


    document.getElementById(
        "pageSubtitle"
    ).innerText =
        "Products in this subcategory";


    document.querySelectorAll(".filter")
    .forEach(btn => {

        btn.classList.remove("active");

    });


    displayProducts(list);
}


function searchProducts(){

    let value =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    let list =
        products.filter(product => {

            let categoryMatch =
                currentCategory === "all" ||
                product.category ===
                currentCategory;


            let subMatch =
                currentSub === "all" ||
                product.sub ===
                currentSub;


            let searchMatch =
                product.name
                .toLowerCase()
                .includes(value)
                ||

                (product.sub || "")
                .toLowerCase()
                .includes(value);


            return (
                categoryMatch &&
                subMatch &&
                searchMatch
            );

        });


    displayProducts(list);
}


function categoryName(category){

    const names = {

        smartphones:
        "Mobiles & Tablets",

        electronics:
        "Electronics",

        fashion:
        "Fashion",

        shoes:
        "Footwear",

        home:
        "Home & Kitchen",

        gaming:
        "Gaming",

        beauty:
        "Beauty",

        watches:
        "Watches",

        accessories:
        "Accessories",

        grocery:
        "Grocery",

        books:
        "Books",

        toys:
        "Toys"

    };


    return names[category] ||
           "Products";
}


function loadURL(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const category =
        params.get("category");

    const sub =
        params.get("sub");


    if(sub){

        showSubcategory(sub);

        return;
    }


    if(category){

        showCategory(category);

        return;
    }


    displayProducts(products);
}


updateCartCount();

loadURL();

</script>

</body>
</html>
