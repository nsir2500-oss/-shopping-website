<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealBrand - Create Account</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#131921;
padding:15px 5%;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffcc00;
text-decoration:none;
}

.box{
width:90%;
max-width:420px;
background:white;
margin:45px auto;
padding:30px;
border-radius:12px;
box-shadow:0 2px 10px #ddd;
}

h1{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:6px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:22px;
border:0;
border-radius:6px;
background:#ff9900;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.login{
text-align:center;
margin-top:20px;
}

.login a{
color:#0066c0;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
}

footer{
margin-top:auto;
background:#131921;
color:white;
text-align:center;
padding:25px;
}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
DealBrand
</a>

</header>

<div class="box">

<h1>🛍️ Create Account</h1>

<form onsubmit="signup(event)">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required
>

<label>Email / Mobile</label>

<input
type="text"
id="user"
placeholder="Enter email or mobile"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create password"
required
>

<label>Confirm Password</label>

<input
type="password"
id="confirm"
placeholder="Confirm password"
required
>

<button type="submit">
Create Account
</button>

</form>

<div id="message" class="message"></div>

<div class="login">

Already have an account?

<a href="login.html">
Login
</a>

</div>

</div>

<footer>

<p>© 2026 DealBrand</p>

</footer>

<script>

function signup(event){

event.preventDefault();

let name =
document.getElementById("name").value;

let user =
document.getElementById("user").value;

let password =
document.getElementById("password").value;

let confirm =
document.getElementById("confirm").value;

if(password !== confirm){

document.getElementById("message").innerText =
"❌ Passwords do not match.";

return;

}

localStorage.setItem(
"dealbrand_name",
name
);

localStorage.setItem(
"dealbrand_user",
user
);

localStorage.setItem(
"dealbrand_password",
password
);

document.getElementById("message").innerText =
"✅ Account created successfully!";

setTimeout(function(){

window.location.href="login.html";

},1000);

}

</script>

</body>
</html>
