<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DealBrand - Login</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#131921;
padding:15px 5%;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffcc00;
text-decoration:none;
}

.box{
width:90%;
max-width:420px;
background:white;
margin:50px auto;
padding:30px;
border-radius:12px;
box-shadow:0 2px 10px #ddd;
}

h1{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:6px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:22px;
border:0;
border-radius:6px;
background:#ff9900;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.signup{
text-align:center;
margin-top:20px;
}

.signup a{
color:#0066c0;
text-decoration:none;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
}

footer{
margin-top:auto;
background:#131921;
color:white;
text-align:center;
padding:25px;
}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
DealBrand
</a>

</header>

<div class="box">

<h1>👤 Login</h1>

<form onsubmit="login(event)">

<label>Email / Mobile</label>

<input
type="text"
id="user"
placeholder="Enter email or mobile"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required
>

<button type="submit">
Login
</button>

</form>

<div id="message" class="message"></div>

<div class="signup">

Don't have an account?

<a href="signup.html">
Create Account
</a>

</div>

</div>

<footer>

<p>© 2026 DealBrand</p>

</footer>

<script>

function login(event){

event.preventDefault();

let user =
document.getElementById("user").value;

let password =
document.getElementById("password").value;

let savedUser =
localStorage.getItem("dealbrand_user");

let savedPassword =
localStorage.getItem("dealbrand_password");

if(
user === savedUser &&
password === savedPassword
){

localStorage.setItem(
"dealbrand_loggedin",
"true"
);

document.getElementById("message").innerText =
"✅ Login successful!";

setTimeout(function(){

window.location.href="index.html";

},800);

}
else{

document.getElementById("message").innerText =
"❌ Incorrect login details.";

}

}

</script>

</body>
</html>
