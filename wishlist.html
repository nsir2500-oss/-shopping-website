<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealBrand - Wishlist</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

header{
background:#131921;
color:white;
padding:14px 5%;
display:flex;
align-items:center;
gap:20px;
flex-wrap:wrap;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ffcc00;
text-decoration:none;
}

.cart{
color:white;
text-decoration:none;
font-weight:bold;
margin-left:auto;
}

.container{
padding:25px 5%;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:18px;
margin-top:20px;
}

.product{
background:white;
padding:18px;
border-radius:10px;
box-shadow:0 2px 8px #ddd;
}

.product-img{
height:160px;
background:#f1f1f1;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
margin-bottom:12px;
}

.price{
font-size:20px;
font-weight:bold;
color:#d35400;
margin:8px 0;
}

button{
width:100%;
padding:10px;
border:0;
border-radius:6px;
cursor:pointer;
margin-top:8px;
font-weight:bold;
}

.cart-btn{
background:#ffd814;
}

.remove-btn{
background:#eee;
}

.empty{
background:white;
padding:40px;
text-align:center;
border-radius:10px;
margin-top:20px;
}

.home{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#ff9900;
color:#111;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">DealBrand</a>

<a href="cart.html" class="cart">🛒 Cart</a>

</header>

<div class="container">

<h1>❤️ My Wishlist</h1>

<div id="wishlist" class="products"></div>

<a href="index.html" class="home">← Continue Shopping</a>

</div>

<script>

let wishlist =
JSON.parse(localStorage.getItem("wishlist")) || [];

function showWishlist(){

let box=document.getElementById("wishlist");

if(wishlist.length===0){

box.innerHTML=`
<div class="empty">
<h2>Your Wishlist is Empty ❤️</h2>
<p>Save products here to buy them later.</p>
</div>
`;

return;
}

box.innerHTML="";

wishlist.forEach((item,index)=>{

let div=document.createElement("div");

div.className="product";

div.innerHTML=`

<div class="product-img">
${item.icon || "🛍️"}
</div>

<h3>${item.name}</h3>

<div class="price">
₹${item.price.toLocaleString("en-IN")}
</div>

<button class="cart-btn"
onclick="addCart(${index})">
🛒 Add to Cart
</button>

<button class="remove-btn"
onclick="removeWishlist(${index})">
❌ Remove
</button>

`;

box.appendChild(div);

});

}

function addCart(index){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:wishlist[index].name,
price:wishlist[index].price
});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("Added to Cart!");

}

function removeWishlist(index){

wishlist.splice(index,1);

localStorage.setItem(
"wishlist",
JSON.stringify(wishlist)
);

showWishlist();

}

showWishlist();

</script>

</body>
</html>
